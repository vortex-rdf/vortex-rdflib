name: CodSpeed

on:
  push:
    branches:
      - main
  # Required to get a performance report on every pull request.
  pull_request:
  # Lets CodSpeed trigger a backtest run to seed the baseline.
  workflow_dispatch:

permissions:
  contents: read
  # OpenID Connect authentication with CodSpeed — no token to store.
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"

      # The default groups are enough: pytest-codspeed lives in `dev`, and the
      # suite in benchmarks/ never touches the `bench` group's contenders.
      - name: Install
        run: uv sync --locked

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: uv run pytest benchmarks --codspeed
