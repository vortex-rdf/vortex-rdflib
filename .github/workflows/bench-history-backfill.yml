name: Benchmark History Backfill

# Measures older commits of main with today's benchmark and writes their
# records to the bench-history branch, so the history chart has points from
# before CI recorded them. Each commit's own library code runs under today's
# harness, dataset and queries: the worktree's src/ goes first on PYTHONPATH,
# ahead of the editable install. Started by hand; re-running a commit
# replaces its record. Only the locked project environment is installed, so
# no third-party code runs next to the write token.
on:
  workflow_dispatch:
    inputs:
      commits:
        description: Commits of main to measure, space-separated
        default: 36caede 2e04fb1 8813a97 0007bb6

permissions:
  contents: write

# Shared with the dashboard workflow, so one job writes bench-history at a time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      # One commit's failure is reported and skipped; the others still run,
      # and everything recorded is pushed together at the end.
      - name: Measure and record each commit
        env:
          COMMITS: ${{ inputs.commits }}
        run: |
          if git ls-remote --exit-code --heads origin bench-history >/dev/null; then
            git fetch --quiet origin bench-history
            git worktree add --detach history FETCH_HEAD
          else
            git worktree add --orphan -b bench-history history
          fi
          adapters="$(uv run python -m bench.history adapters)"
          recorded=""
          for commit in $COMMITS; do
            lib="$RUNNER_TEMP/lib-$commit"
            if ! git worktree add --detach "$lib" "$commit"; then
              echo "::error::$commit: not a commit of this repository; skipped"
              continue
            fi
            if ! found="$(PYTHONPATH="$lib/src" uv run python -c 'import vortex_rdflib; print(vortex_rdflib.__file__)')"; then
              echo "::error::$commit: vortex_rdflib does not import; skipped"
              continue
            fi
            case "$found" in
              "$lib"/*) ;;
              *) echo "::error::$commit: vortex_rdflib resolved to $found, not $lib; skipped"; continue ;;
            esac
            if PYTHONPATH="$lib/src" uv run python -m bench.run_bench \
                 --adapters "$adapters" --out "$RUNNER_TEMP/results-$commit.json" \
               && uv run python -m bench.history record "$RUNNER_TEMP/results-$commit.json" \
                 --source backfill --commit "$commit" --ref main --out history/records; then
              recorded="$recorded $commit"
            else
              echo "::error::$commit: the benchmark or its record did not complete; skipped"
            fi
          done
          if [ -z "$recorded" ]; then
            echo "::error::no commit was recorded"
            exit 1
          fi
          cd history
          git add records
          git commit --quiet -m "bench: backfill$recorded"
          git push --quiet origin HEAD:bench-history \
            || { git fetch --quiet origin bench-history && git rebase --quiet FETCH_HEAD \
                 && git push --quiet origin HEAD:bench-history; }
