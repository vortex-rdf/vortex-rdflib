name: Benchmark History Backfill

# Measures older commits of main with today's harness and writes their records to
# bench-history, so the history charts have points from before CI recorded them.
# Each commit's own library code runs: its worktree's src/ goes first on
# PYTHONPATH, ahead of the editable install, and so does the vortex-rdf release
# its uv.lock pins, installed into a directory of its own. Started by hand;
# re-running a commit replaces its record. The measure job holds a read-only
# token (it runs the BSBM tools' Java); the push job holds the write token and
# runs nothing but git.
on:
  workflow_dispatch:
    inputs:
      commits:
        description: Commits of main to measure, space-separated
        default: 36caede 2e04fb1 8813a97 0007bb6
      dataset:
        description: Which history to backfill
        type: choice
        options:
          - both
          - synthetic
          - bsbm
        default: both

permissions:
  contents: read

# Shared with the dashboard workflow, so one job writes bench-history at a time.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  BSBM_TOOLS_COMMIT: 59d0a8a605b26f21506789fa1a713beb5abf1cab
  BSBM_PRODUCTS: 10000
  BSBM_WARMUP_MIXES: 5
  BSBM_MIXES: 20
  BSBM_SEED: 808080
  BSBM_DIR: bench/bsbm-data/ci
  BSBM_QUERY_TIMEOUT_S: 5
  BSBM_STORE_BUDGET_S: 300

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - uses: actions/setup-java@v4
        if: inputs.dataset != 'synthetic'
        with:
          distribution: temurin
          java-version: '21'
      # The dashboard workflow's cache key: the same prepared data.
      - name: Restore the prepared BSBM data
        if: inputs.dataset != 'synthetic'
        uses: actions/cache@v4
        with:
          path: ${{ env.BSBM_DIR }}
          key: bsbm-${{ env.BSBM_TOOLS_COMMIT }}-p${{ env.BSBM_PRODUCTS }}-w${{ env.BSBM_WARMUP_MIXES }}-m${{ env.BSBM_MIXES }}-s${{ env.BSBM_SEED }}-${{ hashFiles('bench/bsbm/tools.py', 'bench/bsbm/capture.py', 'bench/bsbm/streams.py', 'bench/bsbm/prepare.py') }}
      - name: Prepare the official BSBM data and streams
        if: inputs.dataset != 'synthetic'
        run: >-
          uv run python -m bench.bsbm.prepare --products "$BSBM_PRODUCTS"
          --warmup-mixes "$BSBM_WARMUP_MIXES" --mixes "$BSBM_MIXES" --seed "$BSBM_SEED"
          --out "$BSBM_DIR"
      # One commit's failure is reported and skipped; everything recorded is
      # handed to the push job together.
      - name: Measure and record each commit
        env:
          COMMITS: ${{ inputs.commits }}
          DATASET: ${{ inputs.dataset }}
        run: |
          mkdir -p out/records out/records-bsbm
          adapters="$(uv run python -m bench.history adapters)"
          recorded=""
          for commit in $COMMITS; do
            lib="$RUNNER_TEMP/lib-$commit"
            deps="$RUNNER_TEMP/deps-$commit"
            if ! git worktree add --detach "$lib" "$commit"; then
              echo "::error::$commit: not a commit of this repository; skipped"; continue
            fi
            # The vortex-rdf release this commit locked: today's may not serve its code.
            if ! version="$(git show "$commit:uv.lock" | uv run python -c 'import sys, tomllib; lock = tomllib.loads(sys.stdin.read()); print(next(p["version"] for p in lock["package"] if p["name"] == "vortex-rdf"))')"; then
              echo "::error::$commit: its uv.lock pins no vortex-rdf; skipped"; continue
            fi
            if ! uv pip install --quiet --python .venv/bin/python --target "$deps" --no-deps "vortex-rdf==$version"; then
              echo "::error::$commit: vortex-rdf $version did not install; skipped"; continue
            fi
            path="$deps:$lib/src"
            if ! found="$(PYTHONPATH="$path" uv run python -c 'import vortex_rdf, vortex_rdflib; print(vortex_rdflib.__file__); print(vortex_rdf.__file__)')"; then
              echo "::error::$commit: vortex_rdflib or vortex_rdf does not import; skipped"; continue
            fi
            case "$(echo "$found" | sed -n 1p)" in "$lib"/*) ;; *)
              echo "::error::$commit: vortex_rdflib resolved outside $lib; skipped"; continue ;;
            esac
            case "$(echo "$found" | sed -n 2p)" in "$deps"/*) ;; *)
              echo "::error::$commit: vortex_rdf resolved outside $deps; skipped"; continue ;;
            esac
            ok=1
            # The record step runs today's bench.history with $deps first, so the
            # record names the commit's vortex-rdf version.
            if [ "$DATASET" != bsbm ]; then
              PYTHONPATH="$path" uv run python -m bench.run_bench --adapters "$adapters" \
                  --out "$RUNNER_TEMP/results-$commit.json" \
                && PYTHONPATH="$deps" uv run python -m bench.history record \
                  "$RUNNER_TEMP/results-$commit.json" --source backfill --commit "$commit" \
                  --ref main --out out/records \
                || { echo "::error::$commit: the synthetic benchmark or its record did not complete"; ok=0; }
            fi
            if [ "$DATASET" != synthetic ]; then
              PYTHONPATH="$path" uv run python -m bench.run_bench --dataset bsbm --bsbm-dir "$BSBM_DIR" \
                  --adapters "$adapters" --out "$RUNNER_TEMP/results-bsbm-$commit.json" \
                && PYTHONPATH="$deps" uv run python -m bench.history record \
                  "$RUNNER_TEMP/results-bsbm-$commit.json" --dataset bsbm --source backfill \
                  --commit "$commit" --ref main --out out/records-bsbm \
                || { echo "::error::$commit: the BSBM benchmark or its record did not complete"; ok=0; }
            fi
            if [ "$ok" = 1 ]; then recorded="$recorded $commit"; fi
          done
          if [ -z "$recorded" ]; then
            echo "::error::no commit was recorded"
            exit 1
          fi
          echo "$recorded" > out/recorded.txt
      - name: Hand the records to the push job
        uses: actions/upload-artifact@v4
        with:
          name: backfill-records
          path: out
          retention-days: 7

  push:
    needs: measure
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: backfill-records
          path: incoming
      - name: Push the records to bench-history
        run: |
          if git ls-remote --exit-code --heads origin bench-history >/dev/null; then
            git fetch --quiet origin bench-history
            git worktree add --detach history FETCH_HEAD
          else
            git worktree add --orphan -b bench-history history
          fi
          for folder in records records-bsbm; do
            if compgen -G "incoming/$folder/*.json" >/dev/null; then
              mkdir -p "history/$folder"
              cp "incoming/$folder/"*.json "history/$folder/"
            fi
          done
          recorded="$(cat incoming/recorded.txt)"
          cd history
          for folder in records records-bsbm; do
            if [ -d "$folder" ]; then git add "$folder"; fi
          done
          if git diff --cached --quiet; then
            echo "no record to push"
            exit 0
          fi
          git commit --quiet -m "bench: backfill$recorded"
          git push --quiet origin HEAD:bench-history \
            || { git fetch --quiet origin bench-history && git rebase --quiet FETCH_HEAD \
                 && git push --quiet origin HEAD:bench-history; }
