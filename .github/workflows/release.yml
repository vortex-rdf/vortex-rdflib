name: Release

# Publishes to PyPI when a `v*` tag is pushed. The package is pure Python:
# one universal wheel plus the sdist.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The full CI matrix must pass on the tagged commit before anything is
  # built or published.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Check tag matches project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project="$(python3 -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "$project" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $project"
            exit 1
          fi
      - name: Build sdist and wheel
        run: |
          uv build
          uvx twine check dist/*
      - name: Smoke-test the wheel
        run: >
          uv run --isolated --no-project
          --with pytest --with dist/*.whl
          pytest tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: release
      url: https://pypi.org/p/vortex-rdflib
    permissions:
      # Trusted Publishing: PyPI mints a short-lived token from this OIDC
      # identity, so no API token needs to live in repository secrets.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
