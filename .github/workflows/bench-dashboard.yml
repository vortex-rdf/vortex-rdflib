name: Benchmark Dashboard

on:
  push:
    branches:
      - main
    # Skip the ~15-minute comparative bench on doc-only pushes. Deliberately
    # narrow: bench/ and scripts/ are dashboard inputs.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  # write: the history chart's records are pushed to the bench-history branch.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install (with bench contenders)
        run: uv sync --locked --group bench

      # rdflib-hdt reads HDT but cannot write it, so its build step shells out
      # to the Rust crate's CLI. The contenders whose pins conflict with the
      # project environment (pycottas, rdflib-hdt) get isolated venvs that
      # run_bench builds itself; rdflib-hdt compiles hdt-cpp from source there,
      # which needs the C++ toolchain ubuntu-latest already ships.
      - name: Install the HDT builder
        run: cargo install hdt --features cli --locked

      # Full scale: the code defaults (250k quads over 8 graphs). One worker per
      # store; peak-RSS readings are per-store and uncontaminated.
      - name: Run comparative benchmark
        run: uv run python -m bench.run_bench --out bench/results.json

      # The history chart's data: one record per commit on the bench-history
      # branch, kept across deploys. A failed push costs later dashboards this
      # point, not this deploy, which renders it from disk.
      - name: Record the history point
        run: |
          if git ls-remote --exit-code --heads origin bench-history >/dev/null; then
            git fetch --quiet origin bench-history
            git worktree add --detach history FETCH_HEAD
          else
            git worktree add --orphan -b bench-history history
          fi
          uv run python -m bench.history record bench/results.json \
            --source ci --commit "$GITHUB_SHA" --ref main --out history/records
          cd history
          git add records
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "bench: record ${GITHUB_SHA::7}"
          git push --quiet origin HEAD:bench-history \
            || { git fetch --quiet origin bench-history && git rebase --quiet FETCH_HEAD \
                 && git push --quiet origin HEAD:bench-history; } \
            || echo "::warning::could not push the history record for ${GITHUB_SHA::7}"

      - name: Render dashboard
        run: >-
          uv run python scripts/render_bench_dashboard.py bench/results.json public/index.html
          --history history/records

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
