name: Benchmark Dashboard

on:
  push:
    branches:
      - main
    # Skip the ~15-minute comparative bench on doc-only pushes. Deliberately
    # narrow: bench/ and scripts/ are dashboard inputs.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

# The build job installs third-party code (the contenders, the hdt crate), so
# its token can only read the repository. The record job below is the one
# place that writes, and it runs nothing but git.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install (with bench contenders)
        run: uv sync --locked --group bench

      # rdflib-hdt reads HDT but cannot write it, so its build step shells out
      # to the Rust crate's CLI. The contenders whose pins conflict with the
      # project environment (pycottas, rdflib-hdt) get isolated venvs that
      # run_bench builds itself; rdflib-hdt compiles hdt-cpp from source there,
      # which needs the C++ toolchain ubuntu-latest already ships.
      - name: Install the HDT builder
        run: cargo install hdt --features cli --locked

      # Full scale: the code defaults (250k quads over 8 graphs). One worker per
      # store; peak-RSS readings are per-store and uncontaminated.
      - name: Run comparative benchmark
        run: uv run python -m bench.run_bench --out bench/results.json

      # The history chart's data: one record per main commit on the
      # bench-history branch, kept across deploys. Read here, pushed by the
      # record job.
      - name: Fetch the history
        run: |
          if git ls-remote --exit-code --heads origin bench-history >/dev/null; then
            git fetch --quiet origin bench-history
            git worktree add --detach history FETCH_HEAD
          fi

      # This commit's point, on main only: a manual run on another branch must
      # not land on main's line. A failure costs the point, never the deploy.
      - name: Record this commit's point
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: >-
          uv run python -m bench.history record bench/results.json
          --source ci --commit "$GITHUB_SHA" --ref main --out history/records

      - name: Hand the record to the record job
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: history-record
          path: history/records/${{ github.sha }}.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Render dashboard
        run: >-
          uv run python scripts/render_bench_dashboard.py bench/results.json public/index.html
          --history history/records

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  # Pushes the build job's record to bench-history. The only job with write
  # access, and it runs nothing but git. A push that loses a race rebases once.
  record:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: history-record
          path: incoming

      - name: Push the record to bench-history
        run: |
          if git ls-remote --exit-code --heads origin bench-history >/dev/null; then
            git fetch --quiet origin bench-history
            git worktree add --detach history FETCH_HEAD
          else
            git worktree add --orphan -b bench-history history
          fi
          mkdir -p history/records
          cp incoming/*.json history/records/
          cd history
          git add records
          git commit --quiet -m "bench: record ${GITHUB_SHA::7}"
          git push --quiet origin HEAD:bench-history \
            || { git fetch --quiet origin bench-history && git rebase --quiet FETCH_HEAD \
                 && git push --quiet origin HEAD:bench-history; }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
