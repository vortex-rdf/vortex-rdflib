[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[project]
name = "vortex-rdflib"
version = "0.1.0"
description = "rdflib Store implementation for Vortex-RDF, a columnar RDF store"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
  { name = "Julián Rojas", email = "julianandres.rojasmelendez@ugent.be" },
]
keywords = ["rdf", "rdflib", "vortex", "columnar", "quad-store", "sparql"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  # The native binding layer (PyO3 extension over vortex-rdf-core). This
  # package is the rdflib integration built on top of it.
  "vortex-rdf>=0.10,<0.11",
  "rdflib>=7,<8",
]

[dependency-groups]
# pytest-codspeed instruments bench/test_codspeed.py. It sits in dev rather
# than the bench group so `uv sync` alone can run the instrumented suite —
# the bench group is for the comparative dashboard's third-party contenders,
# which the CodSpeed run deliberately does not need.
dev = [
    "pytest>=8",
    "pytest-codspeed>=4",
    "ruff>=0.16",
    "ty>=0.0.60",
]
# Comparative benchmark contenders (bench/): oxrdflib pulls pyoxigraph.
bench = ["oxrdflib>=0.4"]

[project.urls]
Homepage = "https://github.com/vortex-rdf/vortex-rdflib"
Repository = "https://github.com/vortex-rdf/vortex-rdflib"
Issues = "https://github.com/vortex-rdf/vortex-rdflib/issues"
"Vortex-RDF" = "https://github.com/vortex-rdf/vortex-rdf"

[tool.uv.build-backend]
# uv_build's sdist default is pyproject/README/LICENSE/src only; ship the
# test suite too so the sdist is self-verifying.
source-include = ["tests/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
# Matches the rustfmt width used across the vortex-rdf repos.
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# pycodestyle/pyflakes (E, F, W), import sorting (I), modern syntax (UP),
# bugbear's likely-bug patterns (B).
select = ["E", "F", "W", "I", "UP", "B"]
